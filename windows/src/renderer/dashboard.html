<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>秒薪浮窗</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body class="dashboard-body">
    <main class="panel">
      <header class="header">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <h1 id="status-label" class="status-label">休息中</h1>
        <p id="date-label" class="date-label"></p>
        <span class="spacer"></span>
        <button id="warning" class="icon-button warning" type="button" hidden aria-label="数据警告">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 3.2 2.8 19.2A1.6 1.6 0 0 0 4.2 21.6h15.6a1.6 1.6 0 0 0 1.4-2.4L12 3.2zm0 5.2a1 1 0 0 1 1 1v4.2a1 1 0 1 1-2 0V9.4a1 1 0 0 1 1-1zm0 9.2a1.15 1.15 0 1 1 0-2.3 1.15 1.15 0 0 1 0 2.3z"
            />
          </svg>
        </button>
        <button id="open-settings" class="icon-button" type="button" aria-label="打开设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.4 13.5a7.7 7.7 0 0 0 .1-1.5 7.7 7.7 0 0 0-.1-1.5l2-1.6a.8.8 0 0 0 .2-.9l-1.9-3.3a.8.8 0 0 0-.9-.3l-2.4 1a7.4 7.4 0 0 0-2.6-1.5l-.4-2.5a.8.8 0 0 0-.8-.6h-3.8a.8.8 0 0 0-.8.6l-.4 2.5a7.4 7.4 0 0 0-2.6 1.5l-2.4-1a.8.8 0 0 0-.9.3L1.3 7.9a.8.8 0 0 0 .2.9l2 1.6a7.7 7.7 0 0 0 0 3l-2 1.6a.8.8 0 0 0-.2.9l1.9 3.3a.8.8 0 0 0 .9.3l2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5a.8.8 0 0 0 .8.6h3.8a.8.8 0 0 0 .8-.6l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1a.8.8 0 0 0 .9-.3l1.9-3.3a.8.8 0 0 0-.2-.9l-2-1.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
            />
          </svg>
        </button>
        <button id="hide-window" class="icon-button" type="button" aria-label="隐藏浮窗">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M6.7 5.3a1 1 0 0 0-1.4 1.4L10.6 12l-5.3 5.3a1 1 0 1 0 1.4 1.4L12 13.4l5.3 5.3a1 1 0 0 0 1.4-1.4L13.4 12l5.3-5.3a1 1 0 0 0-1.4-1.4L12 10.6 6.7 5.3z"
            />
          </svg>
        </button>
      </header>

      <section class="earnings" aria-label="今日已挣">
        <p class="eyebrow">今日已挣</p>
        <div class="earnings-row">
          <span class="currency">¥</span>
          <span id="earned" class="earnings-amount digits">0.00</span>
        </div>
      </section>

      <section class="countdown-card" aria-live="polite">
        <p id="countdown-label" class="countdown-label">距离下班</p>
        <p id="countdown" class="countdown digits">00:00:00</p>
      </section>

      <section class="metrics">
        <div class="metric">
          <p class="metric-label">秒薪</p>
          <p id="rate" class="metric-value digits">¥0.0367</p>
        </div>
        <span class="metric-rule" aria-hidden="true"></span>
        <div class="metric">
          <p class="metric-label">已工作时长</p>
          <p id="worked" class="metric-value digits">0h 00m 00s</p>
        </div>
        <span class="metric-rule" aria-hidden="true"></span>
        <div class="metric">
          <p class="metric-label">无偿打工时长</p>
          <p id="unpaid" class="metric-value digits">0h 00m 00s</p>
        </div>
      </section>

      <button id="work-button" class="work-button" type="button" aria-label="开始工作">
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M8 5.5v13l11-6.5-11-6.5z" />
        </svg>
        <svg class="pause" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M7 5h3.2v14H7V5zm6.8 0H17v14h-3.2V5z" />
        </svg>
        <span id="work-label">开始工作</span>
      </button>
    </main>
    <script src="./dashboard.js"></script>
  </body>
</html>
